<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reusable Eye-Catching Form</title>
<style>
  /* -------------------------
     General Styles
  ------------------------- */
  body {
    margin: 0;
    font-family: 'Arial', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: linear-gradient(135deg, #6a11cb, #2575fc);
  }

  /* -------------------------
     Form Container
  ------------------------- */
  .form-container {
    background: rgba(255, 255, 255, 0.1);
    padding: 2rem 3rem;
    border-radius: 15px;
    backdrop-filter: blur(10px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    max-width: 400px;
    width: 100%;
    color: white;
  }

  .form-container h2 {
    text-align: center;
    margin-bottom: 1.5rem;
    font-size: 2rem;
    background: linear-gradient(90deg, #ff4d4d, #ffcc00);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* -------------------------
     Form Fields
  ------------------------- */
  .form-group {
    position: relative;
    margin-bottom: 1.5rem;
  }

  .form-group input,
  .form-group textarea {
    width: 100%;
    padding: 1rem 0.75rem;
    border-radius: 10px;
    border: none;
    outline: none;
    background: rgba(255,255,255,0.15);
    color: white;
    font-size: 1rem;
    transition: all 0.3s ease;
  }

  .form-group input:focus,
  .form-group textarea:focus {
    background: rgba(255,255,255,0.25);
    box-shadow: 0 0 10px rgba(255, 77, 77, 0.5);
  }

  .form-group label {
    position: absolute;
    top: 50%;
    left: 0.75rem;
    transform: translateY(-50%);
    color: rgba(255,255,255,0.7);
    font-size: 1rem;
    pointer-events: none;
    transition: all 0.3s ease;
  }

  .form-group input:focus + label,
  .form-group input:not(:placeholder-shown) + label,
  .form-group textarea:focus + label,
  .form-group textarea:not(:placeholder-shown) + label {
    top: -10px;
    left: 0.5rem;
    font-size: 0.85rem;
    color: #ff4d4d;
  }

  /* -------------------------
     Submit Button
  ------------------------- */
  .submit-btn {
    width: 100%;
    padding: 1rem;
    border-radius: 50px;
    border: none;
    background: linear-gradient(90deg, #ff4d4d, #ffcc00);
    color: #fff;
    font-size: 1.2rem;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 5px 15px rgba(255,77,77,0.4);
  }

  .submit-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 8px 20px rgba(255,77,77,0.6);
  }

  /* -------------------------
     Feedback Message
  ------------------------- */
  .form-message {
    text-align: center;
    margin-top: 1rem;
    font-weight: bold;
    display: none;
  }

  .form-message.success {
    color: #00ff88;
  }

  .form-message.error {
    color: #ff4d4d;
  }

</style>
</head>
<body>

<div class="form-container">
  <h2>Contact Us</h2>
  <form id="contact-form">
    <div class="form-group">
      <input type="text" id="name" placeholder=" " required>
      <label for="name">Name</label>
    </div>
    <div class="form-group">
      <input type="email" id="email" placeholder=" " required>
      <label for="email">Email</label>
    </div>
    <div class="form-group">
      <textarea id="message" placeholder=" " rows="4" required></textarea>
      <label for="message">Message</label>
    </div>
    <button type="submit" class="submit-btn">Send Message</button>
    <div class="form-message" id="form-message"></div>
  </form>
</div>

<script>
  // ------------------------------
  // Form JS Functionality
  // ------------------------------
  const form = document.getElementById('contact-form');
  const formMessage = document.getElementById('form-message');

  form.addEventListener('submit', (e) => {
    e.preventDefault();

    // Simple validation
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const message = document.getElementById('message').value.trim();

    if(name === '' || email === '' || message === ''){
      formMessage.textContent = 'Please fill in all fields.';
      formMessage.className = 'form-message error';
      formMessage.style.display = 'block';
      return;
    }

    // Mock sending
    formMessage.textContent = 'Message sent successfully!';
    formMessage.className = 'form-message success';
    formMessage.style.display = 'block';

    // Clear form
    form.reset();
  });
</script>

</body>
</html>
