<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reusable Eye-Catching Navbar</title>
<style>
  /* -------------------------
     General Styles
  ------------------------- */
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    scroll-behavior: smooth;
  }

  a {
    text-decoration: none;
    color: inherit;
  }

  /* -------------------------
     Navbar Styles
  ------------------------- */
  nav {
    position: fixed;
    top: 0;
    width: 100%;
    background: transparent;
    transition: background 0.3s, box-shadow 0.3s;
    z-index: 1000;
  }

  nav.scrolled {
    background: white;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  }

  .nav-container {
    max-width: 1200px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1rem 2rem;
  }

  .logo {
    font-size: 1.8rem;
    font-weight: bold;
    background: linear-gradient(90deg, #ff4d4d, #ffcc00);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  ul.nav-links {
    display: flex;
    list-style: none;
    gap: 2rem;
    align-items: center;
  }

  ul.nav-links li {
    position: relative;
  }

  ul.nav-links li a {
    position: relative;
    padding: 5px 0;
    color: #333;
    font-weight: 500;
    transition: color 0.3s;
  }

  ul.nav-links li a:hover {
    color: #ff4d4d;
  }

  /* Animated underline */
  ul.nav-links li a::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: 0;
    width: 0%;
    height: 2px;
    background: #ff4d4d;
    transition: width 0.3s;
  }

  ul.nav-links li a:hover::after {
    width: 100%;
  }

  /* Dropdown Menu */
  ul.nav-links li ul.dropdown {
    position: absolute;
    top: 100%;
    left: 0;
    background: white;
    list-style: none;
    padding: 0.5rem 0;
    display: none;
    border-radius: 6px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
  }

  ul.nav-links li:hover ul.dropdown {
    display: block;
    animation: dropdownFade 0.3s ease forwards;
  }

  ul.nav-links li ul.dropdown li {
    padding: 0;
  }

  ul.nav-links li ul.dropdown li a {
    display: block;
    padding: 0.5rem 1.5rem;
    color: #333;
    font-weight: 400;
    white-space: nowrap;
  }

  ul.nav-links li ul.dropdown li a:hover {
    background: #ff4d4d;
    color: white;
  }

  @keyframes dropdownFade {
    0% { opacity: 0; transform: translateY(-10px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* -------------------------
     Mobile Menu
  ------------------------- */
  .hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
  }

  .hamburger div {
    width: 25px;
    height: 3px;
    background: #333;
    transition: all 0.3s;
  }

  .hamburger.active div:nth-child(1) {
    transform: rotate(45deg) translate(5px,5px);
  }

  .hamburger.active div:nth-child(2) {
    opacity: 0;
  }

  .hamburger.active div:nth-child(3) {
    transform: rotate(-45deg) translate(5px,-5px);
  }

  @media (max-width: 768px) {
    ul.nav-links {
      position: fixed;
      top: 0;
      right: -100%;
      flex-direction: column;
      width: 250px;
      height: 100vh;
      background: white;
      padding-top: 5rem;
      gap: 1.5rem;
      transition: right 0.3s ease;
      box-shadow: -5px 0 15px rgba(0,0,0,0.1);
    }

    ul.nav-links.active {
      right: 0;
    }

    .hamburger {
      display: flex;
    }

    ul.nav-links li:hover ul.dropdown {
      display: none; /* Disable hover dropdown on mobile */
    }

    ul.nav-links li ul.dropdown {
      position: static;
      background: none;
      box-shadow: none;
      padding: 0;
    }

    ul.nav-links li ul.dropdown li a {
      padding-left: 2rem;
    }
  }
</style>
</head>
<body>

<nav id="navbar">
  <div class="nav-container">
    <div class="logo">MyBrand</div>

    <ul class="nav-links" id="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li>
        <a href="#">Services ▾</a>
        <ul class="dropdown">
          <li><a href="#">Web Design</a></li>
          <li><a href="#">UI/UX</a></li>
          <li><a href="#">SEO</a></li>
        </ul>
      </li>
      <li><a href="#">Portfolio</a></li>
      <li><a href="#">Contact</a></li>
    </ul>

    <div class="hamburger" id="hamburger">
      <div></div>
      <div></div>
      <div></div>
    </div>
  </div>
</nav>

<script>
  // Sticky navbar on scroll
  const navbar = document.getElementById('navbar');
  window.addEventListener('scroll', () => {
    if(window.scrollY > 50){
      navbar.classList.add('scrolled');
    } else {
      navbar.classList.remove('scrolled');
    }
  });

  // Mobile menu toggle
  const hamburger = document.getElementById('hamburger');
  const navLinks = document.getElementById('nav-links');

  hamburger.addEventListener('click', () => {
    hamburger.classList.toggle('active');
    navLinks.classList.toggle('active');
  });

  // Close mobile menu when link clicked
  document.querySelectorAll('.nav-links a').forEach(link => {
    link.addEventListener('click', () => {
      if(navLinks.classList.contains('active')){
        navLinks.classList.remove('active');
        hamburger.classList.remove('active');
      }
    });
  });
</script>

</body>
</html>
