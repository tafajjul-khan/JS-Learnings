<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List App</title>
    <style>
        /* --- Naya Style Code --- */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }

        h1 {
            color: #007bff;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        #input {
            padding: 10px;
            width: 70%;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-right: 5px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        /* Submit button style */
        #submit {
            background-color: #28a745;
            color: white;
        }
        #submit:hover {
            background-color: #218838;
        }

        /* List Styling */
        #list-container {
            list-style: none;
            padding: 0;
            margin-top: 20px;
        }
        
        #list-container li {
            background: white;
            padding: 10px 15px;
            margin-bottom: 8px;
            border-radius: 4px;
            display: flex; /* Flexbox use kiya for alignment */
            justify-content: space-between;
            align-items: center;
        }

        #list-container li span {
             flex-grow: 1; /* Text ko zyada space dene ke liye */
        }
        
        #list-container li button {
            margin-left: 8px;
            padding: 5px 10px;
            font-size: 0.9em;
        }

        /* Complete Button Style */
        .complete-btn {
            background-color: #17a2b8;
            color: white;
        }
        .complete-btn:hover {
            background-color: #138496;
        }

        /* Delete Button Style */
        .delete-btn {
            background-color: #dc3545;
            color: white;
        }
        .delete-btn:hover {
            background-color: #c82333;
        }

        /* Completed Class */
        .completed {
            text-decoration: line-through;
            color: #888;
            background-color: #e9ecef; /* Completed items ka background halka kar diya */
        }
        
        /* Zaroorat na hone par in buttons ko hata diya */
        #btn, #add {
            display: none;
        }
    </style>
</head>
<body>
    <h1>Taffu's Todo List</h1>
    <p>Tafajjul become a billionaire after 5 years</p>
    
    <input id="input" type="text" placeholder="Naya task likhein...">
    <button id="submit">Add Task</button>

    <ul id="list-container">
        </ul>

    <script>
        // DOM Elements
        const inputField = document.getElementById("input");
        const submitButton = document.getElementById('submit');
        const listContainer = document.getElementById('list-container');
        
        // Purane buttons jinhe humne style mein hide kar diya hai
        // const btn = document.getElementById("btn");
        // const btn2 = document.getElementById('add');

        // --- Todo List Logic ---
        submitButton.addEventListener('click', () => {
            const enteredValue = inputField.value.trim(); // Trim se extra spaces hat jaate hain
            
            // Agar input khaali ho to kuch na karein
            if (enteredValue === "") {
                alert("Please enter a task!");
                return;
            }

            // 1. LI Element banana
            const listItem = document.createElement("li");
            
            // Text ko <li> ke andar <span> mein rakha taaki buttons alag ho sakein
            const taskText = document.createElement("span");
            taskText.textContent = enteredValue;
            listItem.appendChild(taskText);

            // 2. Complete Button
            const completeBtn = document.createElement("button");
            completeBtn.textContent = "✔";
            completeBtn.classList.add('complete-btn'); // Style ke liye class add ki
            listItem.appendChild(completeBtn);

            // 3. Delete Button
            const deleteBtn = document.createElement("button");
            deleteBtn.textContent = "X";
            deleteBtn.classList.add('delete-btn'); // Style ke liye class add ki
            listItem.appendChild(deleteBtn);

            // 4. LI ko UL mein add karna
            listContainer.appendChild(listItem); 

            // 5. Input field ko khaali karna
            inputField.value = '';

            // --- Event Listeners For New Item ---
            
            // Complete Logic (Cut wali line)
            completeBtn.addEventListener('click', () => {
                listItem.classList.toggle('completed');
            });

            // Delete Logic
            deleteBtn.addEventListener('click', () => {
                listItem.remove();
            });
        });

        // --- Purane Logic ko hata diya ya ignore kar diya kyunki woh Todo functionality ke liye zaroori nahi the ---
        
        // (Purana btn logic)
        // btn.addEventListener("click", () => { /* ... */ });
        
        // (Purana btn2/add logic)
        // btn2.addEventListener('click', () => { /* ... */ }, {once: true});

    </script>
</body>
</html>
